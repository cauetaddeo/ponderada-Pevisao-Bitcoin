services:
  training:
    # Só executa o treinamento quando esse serviço é solicitado explicitamente.
    profiles: [training]
    build: .
    image: btc-prophet-training:local
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: btc-prophet-backend:local
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # O modelo vem do treinamento e é montado sem permissão de escrita.
      - ./artifacts:/app/artifacts:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
